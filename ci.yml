# =============================================================================
# .github/workflows/ci.yml
# Industrial RTOS Firmware - CI/CD Pipeline
#
# Stages:
#   1. lint        - clang-format + cppcheck static analysis
#   2. build       - Cross-compile for ARM Cortex-M4 (release + debug)
#   3. test        - Run Unity unit tests on host (native gcc)
#   4. docs        - Generate Doxygen HTML documentation
#   5. size-report - Binary size report (arm-none-eabi-size)
# =============================================================================

name: Firmware CI

on:
  push:
    branches: [ "main", "develop", "release/**" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

env:
  ARM_TOOLCHAIN: "arm-none-eabi"
  BUILD_DIR: "build"
  ARTIFACT_DIR: "artifacts"

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Code Quality - Formatting & Static Analysis
  # ---------------------------------------------------------------------------
  lint:
    name: "Lint & Static Analysis"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-format & cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-17 cppcheck

      - name: Check code formatting (clang-format)
        run: |
          find src include drivers -name '*.c' -o -name '*.h' | \
          xargs clang-format-17 --dry-run --Werror --style=file
          echo "✅ Code format check passed"

      - name: Run cppcheck static analysis
        run: |
          cppcheck \
            --error-exitcode=1 \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --std=c11 \
            --inline-suppr \
            -I include \
            -I middlewares/freertos/include \
            src/ drivers/ \
            2>&1 | tee cppcheck-report.txt
          echo "✅ Static analysis passed"

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

  # ---------------------------------------------------------------------------
  # JOB 2: Cross-Compilation (ARM Cortex-M4)
  # ---------------------------------------------------------------------------
  build:
    name: "Build ARM Firmware"
    runs-on: ubuntu-24.04
    needs: lint

    strategy:
      matrix:
        build_type: [ Release, Debug ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            cmake \
            ninja-build
          arm-none-eabi-gcc --version

      - name: Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DTARGET_MCU=STM32F407VG

      - name: Build firmware
        run: |
          cmake --build ${{ env.BUILD_DIR }} --parallel $(nproc)
          echo "✅ Build (${{ matrix.build_type }}) succeeded"

      - name: Generate size report
        run: |
          arm-none-eabi-size --format=berkeley \
            ${{ env.BUILD_DIR }}/*.elf | tee size-report-${{ matrix.build_type }}.txt
          echo "---"
          arm-none-eabi-size --format=sysv \
            ${{ env.BUILD_DIR }}/*.elf

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.build_type }}
          path: |
            ${{ env.BUILD_DIR }}/*.elf
            ${{ env.BUILD_DIR }}/*.bin
            ${{ env.BUILD_DIR }}/*.hex
            ${{ env.BUILD_DIR }}/*.map
            size-report-${{ matrix.build_type }}.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # JOB 3: Unit Tests (Host native build with Unity framework)
  # ---------------------------------------------------------------------------
  unit-test:
    name: "Unit Tests (Host)"
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc cmake ninja-build gcovr

      - name: Configure for host testing
        run: |
          cmake -B build-test \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DHOST_BUILD=ON

      - name: Build and run tests
        run: |
          cmake --build build-test --parallel $(nproc)
          cd build-test && ctest --output-on-failure --parallel $(nproc)

      - name: Generate coverage report
        run: |
          gcovr \
            --root . \
            --exclude 'tests/.*' \
            --exclude 'middlewares/.*' \
            --html-details coverage/index.html \
            --xml coverage/coverage.xml \
            --print-summary

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build-test/Testing/
            coverage/

      - name: Publish coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ---------------------------------------------------------------------------
  # JOB 4: Documentation (Doxygen)
  # ---------------------------------------------------------------------------
  docs:
    name: "Generate Documentation"
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen docs
        run: doxygen docs/doxygen/Doxyfile

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'push'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html

  # ---------------------------------------------------------------------------
  # JOB 5: Release (tag-triggered)
  # ---------------------------------------------------------------------------
  release:
    name: "Create Release"
    runs-on: ubuntu-24.04
    needs: [ build, unit-test ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-Release
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.elf
            release/*.bin
            release/*.hex
          generate_release_notes: true
          draft: false
          prerelease: false
